# ---- JVM / 内存：手机容器可用内存有限，必须限制堆大小 ----
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# ---- 关键：本机是 aarch64，Google Maven 不提供 aarch64 版 aapt2 ----
# 使用 Termux 提供的 aarch64 aapt2（bionic 版，经 shim 脚本包装）
# 在 x86_64 机器（如本机）构建时必须停用，否则 Gradle 会去找 /opt 下不存在的 aapt2：
# android.aapt2FromMavenOverride=/opt/goldlab-tools/bin/aapt2

kotlin.code.style=official
